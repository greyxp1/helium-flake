name: Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Helium version to update to. Defaults to the latest upstream release.
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      version: ${{ steps.check.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Check for update
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          current=$(perl -ne 'print "$1\n" if /version = "([^"]+)";/' flake.nix)
          latest=${INPUT_VERSION:-$(gh api repos/imputnet/helium-linux/releases/latest --jq '.tag_name')}
          [ -n "$current" ] && [ -n "$latest" ] || { echo "Could not resolve version" >&2; exit 1; }

          {
            echo "latest=$latest"
            [ "$current" != "$latest" ] && echo "update_needed=true" || echo "update_needed=false"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        if: steps.check.outputs.update_needed == 'true'
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      - name: Update flake
        if: steps.check.outputs.update_needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail

          for system in x86_64-linux aarch64-linux; do
            case "$system" in
              x86_64-linux) arch=x86_64 ;;
              aarch64-linux) arch=arm64 ;;
            esac
            url="https://github.com/imputnet/helium-linux/releases/download/$VERSION/helium-$VERSION-${arch}_linux.tar.xz"
            hash=$(nix store prefetch-file --hash-type sha256 --json "$url" | jq -r '.hash // empty')
            [ -n "$hash" ] || { echo "Failed to prefetch $url" >&2; exit 1; }

            SYSTEM="$system" HASH="$hash" perl -0pi -e '
              s/($ENV{SYSTEM} = ")sha256-[^"]+";/$1$ENV{HASH}";/;
            ' flake.nix
          done
          perl -0pi -e 's/version = "[^"]+";/version = "$ENV{VERSION}";/' flake.nix
          nix flake update --accept-flake-config
          nix flake check --no-build --all-systems --no-update-lock-file --accept-flake-config

      - name: Upload candidate
        if: steps.check.outputs.update_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: helium-update
          path: |
            flake.nix
            flake.lock
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.update_needed == 'true'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: helium-update

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      - name: Build configured Helium
        run: |
          nix build --impure --no-link --no-update-lock-file --accept-flake-config --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = flake.inputs.nixpkgs.lib.nixosSystem {
                system = builtins.currentSystem;
                modules = [flake.nixosModules.helium {
                  programs.helium.enable = true;
                }];
              };
            in system.config.programs.helium.finalPackage
          '

  commit:
    needs: [prepare, build]
    if: needs.prepare.outputs.update_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: helium-update

      - name: Commit update
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPDATE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "update helium to $VERSION"
          git push origin "HEAD:$UPDATE_BRANCH"
